[project]
name = "stitchai"
version = "0.1.0"
description = "StitchAI - an autonomous merchant desk that sells to and buys from AI agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    # JWS, off the shelf. Signing is not ours to hand-roll (ADR-0011).
    "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    # Embedded Postgres, used by the test fixtures when no server is supplied.
    "pgserver>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["desk", "world"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# Prose is not ours to reformat; the snippets in docs/ align their comments on purpose.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["desk", "world", "tests"]

[[tool.mypy.overrides]]
# The embedded test server ships no type information.
module = "pgserver.*"
ignore_missing_imports = true
follow_imports = "skip"
